<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#060A12;--panel:#0B1322;--panel2:#0F1A2E;--line:#1C2B45;--fg:#DCE7F5;--muted:#8495B0;
  --cyan:#46D6FF;--mint:#4FE3B0;--amber:#FFB44D;--pink:#FF6FA8;--c:var(--muted);
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font:600 20px var(--display);letter-spacing:.04em}
.brand span{font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat{font:500 11px var(--mono);letter-spacing:.1em;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.stat b{color:var(--cyan);font-weight:500}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
#orbwrap{padding:26px 0 8px;display:flex;flex-direction:column;align-items:center;gap:14px}
#orb{width:104px;height:104px;border-radius:50%;border:1.5px solid var(--c);position:relative;cursor:pointer;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 34%,transparent),transparent 66%);
  transform:scale(var(--lvl,1));transition:transform .08s linear,border-color .25s;padding:0;color:inherit}
#orb::before,#orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 36%,transparent)}
#orb::after{inset:-22px;border-style:dashed;border-color:color-mix(in srgb,var(--c) 20%,transparent)}
body[data-s=asleep]{--c:var(--muted)} body[data-s=listening]{--c:var(--cyan)} body[data-s=hearing]{--c:var(--pink)}
body[data-s=thinking]{--c:var(--amber)} body[data-s=speaking]{--c:var(--mint)} body[data-s=off]{--c:var(--line)}
body[data-s=thinking] #orb::after{animation:spin 2.4s linear infinite}
#state{font:500 12px var(--mono);letter-spacing:.16em;color:var(--c);text-transform:uppercase;text-align:center;min-height:18px}
body[data-s=off] #state,body[data-s=asleep] #state{color:var(--muted)}
#heard{font-size:14px;color:var(--muted);min-height:21px;max-width:720px;padding:0 20px;text-align:center}
#log{flex:1;min-height:0;width:100%;max-width:860px;overflow-y:auto;padding:10px 20px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.m.you{align-self:flex-end;background:var(--panel2);border-color:color-mix(in srgb,var(--cyan) 35%,var(--line))}
.m.mai{align-self:flex-start;background:var(--panel)}
.m.err{align-self:flex-start;border-color:var(--pink);color:var(--pink)}
.m .who{display:block;font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.chips{width:100%;max-width:860px;padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:400 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button:hover{border-color:var(--cyan)}
form{width:100%;max-width:860px;padding:0 20px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#text{flex:1;min-width:180px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:15px var(--body)}
#text:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ib{flex:none;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:500 12.5px var(--mono);letter-spacing:.08em;cursor:pointer}
.ib.on{border-color:var(--mint);color:var(--mint)}
#send{border-color:var(--cyan);color:var(--cyan)}
.hint{font-size:12.5px;color:var(--muted);padding:0 20px 14px;max-width:860px;width:100%;min-height:20px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#orb{transition:none}#orb::after{animation:none!important}}
</style>
</head>
<body data-s="off">
<header>
  <div class="brand"><h1>MAI</h1><span>Marketing MAI · coordinator</span></div>
  <div class="stat" id="stat">connecting…</div>
</header>
<main>
  <div id="orbwrap">
    <button id="orb" type="button" aria-label="Turn MAI's microphone on or off"></button>
    <div id="state" role="status">Click the circle to switch the microphone on</div>
    <div id="heard" aria-live="polite"></div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button type="button">What did you learn last night?</button>
    <button type="button">What's waiting for approval?</button>
    <button type="button">Show me the current ideas</button>
    <button type="button">Give me new ideas</button>
    <button type="button">What content is finished?</button>
  </div>
  <form id="f">
    <input id="text" autocomplete="off" placeholder="Or type here" aria-label="Message to MAI">
    <button class="ib" type="button" id="micoff" title="Switch the microphone off completely">MIC OFF</button>
    <button class="ib on" type="button" id="voice" aria-pressed="true" title="Read replies aloud">VOICE ON</button>
    <button class="ib" type="submit" id="send">SEND</button>
  </form>
  <div class="hint" id="hint"></div>
</main>
<script>
const _fetch = window.fetch;            // on the web address, an ended session sends you to the login
window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401 && r.headers.get("X-MAI-Login")) location.href = "/login"; return r; };

const $ = id => document.getElementById(id);
const log = $("log"), orb = $("orb"), stateEl = $("state"), heard = $("heard"), text = $("text"), hint = $("hint");
const session = "dash-" + Math.random().toString(36).slice(2, 10);

// Speech-to-text may write the wake phrase several ways.
const WAKE = /\bwake[\s-]*up[\s,.!-]*(?:time|mai|my|may)\b[\s,.!?]*/i;
const SLEEP = /\b(?:sleep|good ?night|that'?s all for now|stop listening|stand down)\b/i;
const IDLE_SLEEP_MS = 180000;      // after 3 quiet minutes MAI goes back to sleep

let micOn = false, awake = false, speakOn = true;
let chatAbort = null, turn = 0, idleTimer = null;

function setState(s, label) { document.body.dataset.s = s; stateEl.textContent = label; }
function rest() {
  if (!micOn) setState("off", "Click the circle to switch the microphone on");
  else if (awake) setState("listening", "Listening — just talk");
  else setState("asleep", 'Asleep — say "wake up time"');
  $("micoff").hidden = !micOn;
}
function add(who, body, cls) {
  const d = document.createElement("div");
  d.className = "m " + cls;
  const w = document.createElement("span"); w.className = "who"; w.textContent = who;
  d.append(w, document.createTextNode(body));
  log.append(d); log.scrollTop = log.scrollHeight;
}
function beep(freq, ms = 110) {
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = 0.05; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch (_) {}
}
function touch() {
  clearTimeout(idleTimer);
  if (awake) idleTimer = setTimeout(() => { if (awake && !speaking && !chatAbort) goSleep(); else touch(); }, IDLE_SLEEP_MS);
}
function wake() { if (awake) return; awake = true; beep(660); setTimeout(() => beep(990), 120); rest(); touch(); }
function goSleep() { awake = false; turn++; if (chatAbort) { chatAbort.abort(); chatAbort = null; } stopSpeaking(); beep(520); setTimeout(() => beep(390), 120); heard.textContent = ""; rest(); }

// ---------------- Voice out ----------------
let speaking = false, audioEl = null, ttsDownUntil = 0;

function chunks(t) {
  const parts = t.replace(/[*_#`>]/g, "").replace(/https?:\/\/\S+/g, "a link").match(/[^.!?\n]+[.!?]*\s*/g) || [t];
  const out = []; let cur = "";
  // the first sentence goes alone so MAI starts speaking sooner; later ones are grouped
  for (const p of parts) { if (cur && (!out.length || (cur + p).length > 180)) { out.push(cur.trim()); cur = p; } else cur += p; }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
async function fetchVoice(t) {
  if (Date.now() < ttsDownUntil) return null;
  try {
    const r = await fetch("/api/mai/tts", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: t})});
    if (!r.ok) { ttsDownUntil = Date.now() + 300000; return null; }
    return URL.createObjectURL(await r.blob());
  } catch (_) { ttsDownUntil = Date.now() + 60000; return null; }
}
function browserSay(t, done) {
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(t), vs = speechSynthesis.getVoices();
  u.voice = vs.find(v => v.name === "Google UK English Male") || vs.find(v => v.name === "Daniel") ||
            vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en-IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  u.rate = 1.04; u.pitch = 0.92; u.onend = u.onerror = done;
  speechSynthesis.speak(u);
}
async function speak(t, myTurn) {
  if (!speakOn) return rest();
  const parts = chunks(t);
  speaking = true; setState("speaking", "Speaking — talk to interrupt");
  let next = fetchVoice(parts[0]);
  for (let i = 0; i < parts.length; i++) {
    const url = await next;
    if (myTurn !== turn || !speaking) return;
    next = i + 1 < parts.length ? fetchVoice(parts[i + 1]) : null;
    await new Promise(done => {
      if (url) {
        audioEl = new Audio(url);
        audioEl.onended = audioEl.onerror = () => { URL.revokeObjectURL(url); done(); };
        audioEl.onpause = done;
        audioEl.play().catch(done);
      } else browserSay(parts[i], done);
    });
    if (myTurn !== turn || !speaking) return;
  }
  speaking = false; audioEl = null; rest(); touch();
}
function stopSpeaking() {
  speaking = false;
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

// ---------------- Thinking ----------------
async function ask(msg) {
  msg = msg.trim();
  if (!msg) return;
  const myTurn = ++turn;                    // a newer request replaces whatever was in progress
  if (chatAbort) chatAbort.abort();
  stopSpeaking();
  chatAbort = new AbortController();
  text.value = ""; heard.textContent = "";
  add("YOU", msg, "you");
  setState("thinking", "Thinking");
  touch();
  try {
    const r = await fetch("/api/mai/chat", {method: "POST", signal: chatAbort.signal,
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({message: msg, session})});
    const data = await r.json();
    if (myTurn !== turn) return;
    if (!r.ok) throw new Error(data.detail || "MAI could not answer.");
    chatAbort = null;
    add("MAI", data.reply, "mai");
    speak(data.reply, myTurn);
  } catch (e) {
    if (e.name === "AbortError" || myTurn !== turn) return;
    chatAbort = null;
    add("PROBLEM", String(e.message).slice(0, 240) + " Try again in a moment.", "err");
    rest();
  }
}

// ---------------- Voice in: always-open microphone ----------------
let actx = null, analyser = null, stream = null, recorder = null, recChunks = [], ticker = null;
let noise = 0.01, loud = 0, quiet = 0, inSpeech = false, speechMs = 0, segStart = 0, keep = false;
const FRAME = 40, buf = new Float32Array(1024);

function newSegment() {
  recChunks = []; keep = false; inSpeech = false; loud = quiet = speechMs = 0; segStart = performance.now();
  const rec = recorder = new MediaRecorder(stream);
  rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    const wanted = keep, ms = speechMs, blob = new Blob(recChunks, {type: rec.mimeType});
    if (micOn) newSegment();
    if (wanted) heardSpeech(blob, ms);
  };
  rec.start();
}
function endSegment(wanted) { keep = wanted; if (recorder && recorder.state !== "inactive") recorder.stop(); }

function tick() {
  if (!micOn || !recorder || recorder.state !== "recording") return;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length);
  // while MAI is talking, demand a clearly louder voice so its own sound doesn't count
  const thr = speaking ? Math.max(0.045, noise * 5) : Math.max(0.018, noise * 3.2);
  orb.style.setProperty("--lvl", (1 + Math.min(rms * 6, 0.35)).toFixed(3));
  if (rms > thr) {
    loud++; quiet = 0;
    if (!inSpeech && loud >= (speaking ? 7 : 3)) {
      inSpeech = true;
      if (speaking) { stopSpeaking(); turn++; }          // you interrupted: MAI stops talking at once
      if (awake) setState("hearing", "Hearing you");
    }
    if (inSpeech) speechMs += FRAME;
  } else {
    if (!inSpeech) { noise = noise * 0.96 + rms * 0.04; loud = 0; }
    else if (++quiet * FRAME >= 850) return endSegment(speechMs >= 320);   // you stopped talking
  }
  if (inSpeech && speechMs > 25000) return endSegment(true);
  // nothing said: start a fresh clip every 2 s so each clip begins just before the speech
  if (!inSpeech && performance.now() - segStart > 2000) endSegment(false);
}

let sttBusy = 0;
async function heardSpeech(blob, ms) {
  if (!awake && (ms > 6000 || sttBusy > 0)) return;        // asleep: only short phrases can be the wake words
  sttBusy++;
  if (awake) heard.textContent = "…";
  try {
    const r = await fetch("/api/mai/stt", {method: "POST", headers: {"Content-Type": blob.type || "audio/webm"}, body: blob});
    const said = r.ok ? ((await r.json()).text || "").trim() : "";
    heard.textContent = "";
    if (!said) { if (awake && !speaking && !chatAbort) rest(); return; }
    const w = said.match(WAKE);
    if (!awake) {
      if (!w) return;
      wake();
      const after = said.slice(w.index + w[0].length).trim();
      if (after.split(/\s+/).filter(Boolean).length >= 2) ask(after);
      return;
    }
    if (SLEEP.test(said) && said.split(/\s+/).length <= 6) { add("YOU", said, "you"); return goSleep(); }
    const cmd = w ? said.slice(w.index + w[0].length).trim() : said;
    if (cmd) ask(cmd); else rest();
  } catch (_) { if (awake) rest(); }
  finally { sttBusy--; }
}

function remember(on) { try { localStorage.setItem("mai-mic", on ? "1" : "0"); } catch (_) {} }

async function micStart() {
  if (micOn) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch (e) {
    hint.textContent = e.name === "NotAllowedError"
      ? "Microphone is blocked. In Chrome: click the icon at the left of the address bar → Microphone → Allow, then reload. On the Mac: System Settings → Privacy & Security → Microphone → turn on Google Chrome."
      : "No microphone found (" + e.name + "). Check that one is connected and not in use by another app.";
    return false;
  }
  hint.textContent = "";
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume();
  analyser = actx.createAnalyser(); analyser.fftSize = 1024;
  actx.createMediaStreamSource(stream).connect(analyser);
  micOn = true; newSegment();
  ticker = setInterval(tick, FRAME);
  remember(true); rest();
  return true;
}
function micStop() {
  if (!micOn) return;
  micOn = false; awake = false; turn++; clearInterval(ticker); stopSpeaking();
  try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (_) {}
  stream.getTracks().forEach(t => t.stop());
  orb.style.setProperty("--lvl", 1); remember(false); rest();
}

orb.addEventListener("click", async () => { if (!micOn) return micStart(); awake ? goSleep() : wake(); });
$("micoff").addEventListener("click", micStop);
$("f").addEventListener("submit", e => { e.preventDefault(); ask(text.value); });
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
$("voice").addEventListener("click", e => {
  speakOn = !speakOn; e.target.classList.toggle("on", speakOn);
  e.target.textContent = speakOn ? "VOICE ON" : "VOICE OFF"; e.target.setAttribute("aria-pressed", speakOn);
  if (!speakOn) { stopSpeaking(); rest(); }
});

// The browser only lets a page open the microphone after a click, so a remembered
// "mic on" resumes on the first click or key press.
let wanted = false;
try { wanted = localStorage.getItem("mai-mic") === "1"; } catch (_) {}
if (wanted) {
  stateEl.textContent = "Click anywhere once to switch the microphone back on";
  const resume = e => {
    removeEventListener("pointerdown", resume); removeEventListener("keydown", resume);
    if (!micOn && e.target !== orb && e.target.id !== "micoff") micStart();
  };
  addEventListener("pointerdown", resume); addEventListener("keydown", resume);
}

async function refresh() {
  try {
    const s = await (await fetch("/api/status")).json(), c = s.counts;
    $("stat").innerHTML = `<span>CRAWLER <b>${s.crawl_running ? "RUNNING" : "IDLE"}</b></span>` +
      `<span>PAGES <b>${c.pages}</b></span><span>LEARNINGS <b>${c.learnings}</b></span><span>TO APPROVE <b>${c.held}</b></span>`;
  } catch (_) { $("stat").textContent = "server not reachable — open http://localhost:8000/mai in Chrome"; }
}
$("micoff").hidden = true;
refresh(); setInterval(refresh, 30000);
if ("speechSynthesis" in window) speechSynthesis.getVoices();
add("MAI", "Hello. Click the circle once to switch my microphone on, then say \"wake up time\". After that, just talk; you can interrupt me any time. Say \"sleep time\" when you're done.", "mai");
</script>
</body>
</html>
