# Marketing MAI — all services.
# Database: Postgres with pgvector (the same database Supabase is built on).

name: marketing-mai

services:
  db:                 # Knowledge base, learnings, ideas, content
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./services/db/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  searxng:            # Agent 02's private search engine
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./services/searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    ports:
      - "127.0.0.1:8888:8080"

  crawl4ai:           # Agent 03's page reader
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    shm_size: "1g"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      - CRAWL4AI_MAX_TIMEOUT_MS=90000
    ports:
      - "127.0.0.1:11235:11235"

  backend:            # Agents 02–10, dashboard, MCP tools for MAI
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_PASSWORD=${DB_PASSWORD}
      - VECTOR_DB_HOST=db
      - VECTOR_DB_PORT=5432
      - VECTOR_DB_PASSWORD=${DB_PASSWORD}
      - INPUTS_DIR=/app/inputs
      - DATA_DIR=/app/data
    volumes:
      - ./inputs:/app/inputs:ro
      - ./backend/static:/app/static:ro
      - backend-data:/app/data
    depends_on:
      db: { condition: service_healthy }
      searxng: { condition: service_started }
      crawl4ai: { condition: service_started }
    ports:
      - "127.0.0.1:8000:8000"

  voice:              # MAI's speaking voice (Kokoro), running on our own server
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

  hermes-init:        # copies MAI's configuration and persona into the agent's data folder
    image: nousresearch/hermes-agent:latest
    entrypoint: ["sh", "-c", "cp /opt/seed/config.yaml /opt/data/config.yaml && cp /opt/seed/SOUL.md /opt/data/SOUL.md && chown hermes:hermes /opt/data /opt/data/config.yaml /opt/data/SOUL.md"]
    volumes:
      - hermes-data:/opt/data
      - ./services/hermes:/opt/seed:ro

  hermes:             # Agent 01 — MAI, the coordinator (Hermes Agent)
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: .env
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_KEY}
      - HERMES_TIMEZONE=Asia/Kolkata
    volumes:
      - hermes-data:/opt/data
    depends_on:
      hermes-init: { condition: service_completed_successfully }
      backend: { condition: service_started }
    ports:
      - "127.0.0.1:8642:8642"

volumes:
  db-data:
  searxng-cache:
  backend-data:
  hermes-data:
