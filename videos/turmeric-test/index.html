<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Turmeric Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0D; color: #C9CED6; font: 14px Lato, sans-serif; }
  #stage { display: flex; gap: 12px; height: 100vh; align-items: center; justify-content: center; }
  canvas { height: 100vh; aspect-ratio: 9 / 16; background: #000; }
  canvas.small { height: 48vh; }
  #bar { position: fixed; left: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
  button { background: #C77B4A; border: 0; color: #0B0B0D; font: 700 13px Lato, sans-serif; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="bar"><button id="play">Play</button><button id="save">Make the file</button><span id="status">loading</span></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="film.js"></script>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const say = s => { document.getElementById('status').textContent = s; window.STATUS = s; };
const q = new URLSearchParams(location.search);

window.show = t => { frame(ctx, t); say('t = ' + t.toFixed(2)); return t; };

// several moments side by side, to check the film without playing it
window.sheet = times => {
  const stage = document.getElementById('stage'); stage.innerHTML = ''; stage.style.flexWrap = 'wrap';
  times.forEach(t => { const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; c.className = 'small';
    c.style.height = (times.length > 5 ? 48 : 98) + 'vh'; stage.appendChild(c); frame(c.getContext('2d'), t); });
  return times.length;
};

let playing = false;
document.getElementById('play').onclick = () => {
  playing = !playing; const t0 = performance.now();
  const tick = () => { if (!playing) return; const t = (performance.now() - t0) / 1000; if (t >= DUR) { playing = false; return; } show(t); requestAnimationFrame(tick); };
  tick();
};

// every frame is drawn and encoded one after the other (not in real time), then handed to the small local server
window.makeFile = async () => {
  const { Muxer, ArrayBufferTarget } = Mp4Muxer;
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H }, fastStart: 'in-memory' });
  let failed = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { failed = e; } });
  enc.configure({ codec: 'avc1.64002A', width: W, height: H, bitrate: 12000000, framerate: FPS });
  const total = FPS * DUR;
  for (let i = 0; i < total && !failed; i++) {
    frame(ctx, i / FPS);
    const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
    while (enc.encodeQueueSize > 3) await new Promise(r => setTimeout(r, 4));
    if (i % 10 === 0) { say('frame ' + i + ' of ' + total); await new Promise(r => setTimeout(r, 0)); }
  }
  if (failed) { say('FAILED ' + failed.message); return; }
  await enc.flush(); muxer.finalize();
  const res = await fetch('/save?name=picture.mp4', { method: 'POST', body: muxer.target.buffer });
  say(res.ok ? 'DONE ' + muxer.target.buffer.byteLength : 'FAILED to save');
};
document.getElementById('save').onclick = () => makeFile();

setup().then(() => {
  say('ready');
  if (q.has('sheet')) sheet(q.get('sheet').split(',').map(Number));
  else show(Number(q.get('t') || 0));
  if (q.has('make')) makeFile();
}).catch(e => say('FAILED ' + e.message));
</script>
</body>
</html>
